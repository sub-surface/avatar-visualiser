<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSYCHOGRAPH — Avatar Visualiser</title>

  <!--
    DM Serif Display — modern editorial serif, geometric construction,
    high stroke contrast. Used in contemporary music/media branding.
    DM Mono — same family, used for labels and metadata.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /*
      Two-colour scheme: slate + mauve only.
      Scanlines remain gold (Three.js material, not CSS).

      --s   cool slate   hsl(205, 18%, 68%)   primary text, active
      --m   dusty mauve  hsl(315, 16%, 68%)   accent, artist, rule
    */
    :root {
      --s-hi:    rgba(162, 182, 192, 0.85);
      --s-mid:   rgba(162, 182, 192, 0.45);
      --s-lo:    rgba(162, 182, 192, 0.18);
      --s-rule:  rgba(162, 182, 192, 0.12);

      --m-hi:    rgba(192, 162, 184, 0.80);
      --m-mid:   rgba(192, 162, 184, 0.40);
      --m-lo:    rgba(192, 162, 184, 0.15);
      --m-rule:  rgba(192, 162, 184, 0.20);

      --bg:      #0d0d0d;
      --serif:  'DM Serif Display', Georgia, serif;
      --mono:   'DM Mono', 'Courier New', monospace;
    }

    body {
      background: var(--bg);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
    }

    /* ── Start / loading overlay ────────────────────────────── */
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.4rem;
      z-index: 10;
      cursor: default;
      transition: opacity 0.4s;
    }
    #overlay.ready { cursor: pointer; }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    #overlay span {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1rem;
      letter-spacing: 0.05em;
      color: var(--s-mid);
      user-select: none;
      transition: opacity 0.3s;
    }
    /* Thin animated progress bar shown while loading */
    #loadBar {
      width: 120px;
      height: 1px;
      background: hsl(205 18% 22%);
      overflow: hidden;
    }
    #loadBar::after {
      content: '';
      display: block;
      height: 100%;
      width: 40%;
      background: var(--s-mid);
      animation: loadSlide 1.2s ease-in-out infinite alternate;
    }
    @keyframes loadSlide {
      from { transform: translateX(-60%); }
      to   { transform: translateX(210%); }
    }
    #loadBar.done { display: none; }

    /* ═══════════════════════════════════════════════════════════
       TRACK INFO CARD
       Horizontally centred block, text left-aligned within it.
       Sits in the upper portion, above the grid's horizon.
    ═══════════════════════════════════════════════════════════ */
    #trackInfo {
      position: fixed;
      /* horizontal centre, fixed width so left-alignment is stable */
      left: 50%;
      transform: translateX(-50%);
      top: 6vh;
      width: clamp(280px, 48vw, 680px);
      z-index: 5;
      pointer-events: none;
      user-select: none;
    }

    /* Artist — small mono label above the title */
    #dispArtist {
      font-family: var(--mono);
      font-weight: 300;
      font-size: clamp(0.62rem, 0.9vw, 0.75rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--m-hi);
      line-height: 1;
      margin-bottom: 8px;
    }
    #dispArtist:empty { display: none; }
    #dispArtist:empty + #dispTitle { margin-top: 0; }

    /* Title — large serif, left-aligned, normal case */
    #dispTitle {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(2rem, 4.2vw, 4rem);
      letter-spacing: -0.01em;
      line-height: 0.95;
      color: var(--s-hi);
    }
    #dispTitle:empty { display: none; }

    /* Rule — mauve hairline, appears only when title is set */
    #dispRule {
      height: 1px;
      background: var(--m-rule);
      margin-top: 12px;
      margin-bottom: 10px;
      display: none;  /* shown by JS when title is non-empty */
    }

    /* Metadata row — mono, small, spaced labels */
    #dispMetaRow {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: var(--mono);
      font-weight: 300;
      font-size: clamp(0.6rem, 0.85vw, 0.72rem);
      letter-spacing: 0.12em;
      color: var(--s-mid);
    }
    /* Each meta pill: a faint box around key=value pairs */
    #dispMetaRow .mpill {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }
    #dispMetaRow .mpill .mkey {
      color: var(--m-mid);
      font-size: 0.78em;
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }
    #dispMetaRow .mpill .mval {
      color: var(--s-mid);
    }
    #dispMetaRow .mpill:empty,
    #dispMetaRow .mpill[data-empty] { display: none; }
    /* vertical divider between pills */
    #dispMetaRow .mdiv {
      width: 1px;
      height: 0.7em;
      background: var(--s-lo);
      flex-shrink: 0;
    }

    /* ═══════════════════════════════════════════════════════════
       FIXED CHROME — bottom-left and bottom-right
    ═══════════════════════════════════════════════════════════ */

    /* Shared chrome link / button style */
    .chrome {
      font-family: var(--mono);
      font-weight: 300;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      color: var(--s-lo);
      text-decoration: none;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: color 0.2s;
      text-transform: lowercase;
      user-select: none;
    }
    .chrome:hover:not(:disabled) { color: var(--s-mid); }
    .chrome:disabled { opacity: 0.25; cursor: not-allowed; }

    /* Bottom-left: branding */
    #brandLink {
      position: fixed;
      bottom: 22px;
      left: 28px;
      z-index: 100;
    }

    /* Bottom-right: controls */
    #controls {
      position: fixed;
      bottom: 22px;
      right: 28px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    #progress {
      font-family: var(--mono);
      font-weight: 300;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      color: var(--s-lo);
      text-align: right;
      min-height: 0.75em;
    }

    /* ═══════════════════════════════════════════════════════════
       PARAMETERS PANEL
       Opens upward from the bottom-right controls.
    ═══════════════════════════════════════════════════════════ */
    #paramsPanel {
      display: none;
      flex-direction: column;
      gap: 4px;
      width: 248px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--s-rule);
      text-align: left;
    }
    #paramsPanel.open { display: flex; }

    .psection {
      font-family: var(--mono);
      font-weight: 300;
      font-size: 0.52rem;
      letter-spacing: 0.24em;
      color: var(--s-lo);
      text-transform: uppercase;
      margin-top: 6px;
      margin-bottom: 1px;
    }

    .prow {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .prow label {
      font-family: var(--mono);
      font-weight: 300;
      color: var(--s-mid);
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      white-space: nowrap;
      width: 76px;
      flex-shrink: 0;
    }
    .prow .pval {
      font-family: var(--mono);
      font-weight: 400;
      color: var(--s-hi);
      font-size: 0.6rem;
      letter-spacing: 0.04em;
      width: 32px;
      text-align: right;
      flex-shrink: 0;
    }

    /* Text inputs */
    input[type=text].ptxt {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--s-rule);
      color: var(--s-hi);
      font-family: var(--mono);
      font-weight: 300;
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      outline: none;
      padding: 1px 0;
      min-width: 0;
    }
    input[type=text].ptxt::placeholder { color: var(--s-lo); }
    input[type=text].ptxt:focus { border-bottom-color: var(--s-mid); }

    /* Range inputs — mauve track to distinguish from slate text */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 1px;
      background: var(--m-lo);
      outline: none;
      cursor: pointer;
      min-width: 0;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 6px;
      height: 6px;
      background: var(--m-hi);
      border-radius: 50%;
    }
    input[type=range]:hover { background: var(--m-mid); }

    /* Select inputs */
    select.psel {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--s-rule);
      color: var(--s-hi);
      font-family: var(--mono);
      font-weight: 300;
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      outline: none;
      cursor: pointer;
      padding: 1px 0;
      min-width: 0;
    }
    select.psel option { background: #111; }
  </style>

  <script src="https://unpkg.com/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
  </script>
</head>
<body>

<div id="overlay">
  <div id="loadBar"></div>
  <span id="overlayMsg">loading…</span>
</div>

<!-- ── Track info card — centred, left-aligned within ──────────── -->
<div id="trackInfo">
  <div id="dispArtist"></div>
  <div id="dispTitle"></div>
  <div id="dispRule"></div>
  <div id="dispMetaRow">
    <div class="mpill" id="pillTime">
      <span class="mkey">time</span>
      <span class="mval" id="dispCurrent"></span>
    </div>
    <div class="mdiv" id="divTime" style="display:none"></div>
    <div class="mpill" id="pillBpm">
      <span class="mkey">bpm</span>
      <span class="mval" id="dispBpm"></span>
    </div>
    <div class="mdiv" id="divBpm" style="display:none"></div>
    <div class="mpill" id="pillGenre">
      <span class="mkey">genre</span>
      <span class="mval" id="dispGenre"></span>
    </div>
  </div>
</div>

<!-- ── Bottom-left: branding ───────────────────────────────────── -->
<a class="chrome" id="brandLink" href="https://subsurfaces.net" target="_blank">subsurfaces.net</a>

<!-- ── Bottom-right: controls + params panel ───────────────────── -->
<div id="controls">

  <div id="paramsPanel">

    <div class="psection">track</div>
    <div class="prow"><label>title</label>
      <input type="text" class="ptxt" id="pTitle" placeholder="—" maxlength="60"></div>
    <div class="prow"><label>artist</label>
      <input type="text" class="ptxt" id="pArtist" placeholder="—" maxlength="60"></div>
    <div class="prow"><label>bpm</label>
      <input type="text" class="ptxt" id="pBpm" placeholder="—" maxlength="8"></div>
    <div class="prow"><label>genre</label>
      <input type="text" class="ptxt" id="pGenre" placeholder="—" maxlength="30"></div>

    <div class="psection">dsp</div>
    <div class="prow"><label>freq scale</label>
      <select class="psel" id="pFreqScale">
        <option value="dnb" selected>dnb</option>
        <option value="log">log</option>
        <option value="linear">linear</option>
      </select>
      <span class="pval" id="vFreqScale">dnb</span></div>
    <div class="prow"><label>freq range</label>
      <input type="range" id="pFreqRange" min="0.2" max="1.0" step="0.05" value="0.55">
      <span class="pval" id="vFreqRange">0.55</span></div>
    <div class="prow"><label>smoothing</label>
      <input type="range" id="pSmoothing" min="0.1" max="0.95" step="0.05" value="0.55">
      <span class="pval" id="vSmoothing">0.55</span></div>

    <div class="psection">shape</div>
    <div class="prow"><label>displacement</label>
      <input type="range" id="pMaxDisp" min="0.5" max="5.0" step="0.1" value="2.2">
      <span class="pval" id="vMaxDisp">2.2</span></div>
    <div class="prow"><label>bowl shape</label>
      <input type="range" id="pBowlExp" min="0.5" max="4.0" step="0.1" value="2.0">
      <span class="pval" id="vBowlExp">2.0</span></div>
    <div class="prow"><label>lfo depth</label>
      <input type="range" id="pLfoDepth" min="0.0" max="2.0" step="0.05" value="0.0">
      <span class="pval" id="vLfoDepth">0.0</span></div>
    <div class="prow"><label>lfo rate</label>
      <input type="range" id="pLfoRate" min="0.02" max="1.0" step="0.02" value="0.12">
      <span class="pval" id="vLfoRate">0.12</span></div>

    <div class="psection">modulation</div>
    <div class="prow"><label>sub→disp</label>
      <input type="range" id="pModSub" min="0" max="1.0" step="0.05" value="0.5">
      <span class="pval" id="vModSub">0.5</span></div>
    <div class="prow"><label>kick→cam</label>
      <input type="range" id="pModKick" min="0" max="2.0" step="0.1" value="0.8">
      <span class="pval" id="vModKick">0.8</span></div>
    <div class="prow"><label>mid→lift</label>
      <input type="range" id="pModMid" min="0" max="1.5" step="0.05" value="0.6">
      <span class="pval" id="vModMid">0.6</span></div>
    <div class="prow"><label>high→bowl</label>
      <input type="range" id="pModHigh" min="0" max="1.5" step="0.05" value="0.8">
      <span class="pval" id="vModHigh">0.8</span></div>
    <div class="prow"><label>rms→zoom</label>
      <input type="range" id="pModRms" min="0" max="1.5" step="0.05" value="0.5">
      <span class="pval" id="vModRms">0.5</span></div>
    <div class="prow"><label>trans→opacity</label>
      <input type="range" id="pModTrans" min="0" max="1.0" step="0.05" value="0.4">
      <span class="pval" id="vModTrans">0.4</span></div>

    <div class="psection">grid</div>
    <div class="prow"><label>rows</label>
      <input type="range" id="pRows" min="20" max="120" step="10" value="60">
      <span class="pval" id="vRows">60</span></div>
    <div class="prow"><label>cols</label>
      <input type="range" id="pCols" min="64" max="256" step="32" value="128">
      <span class="pval" id="vCols">128</span></div>

  </div><!-- /paramsPanel -->

  <button class="chrome" id="paramsToggle">parameters</button>
  <button class="chrome" id="exportBtn">load &amp; export</button>
  <div id="progress"></div>

</div>

<input type="file" id="wavInput" accept=".wav,.mp3,.flac,.ogg,.aac,.m4a,audio/*" style="display:none">

<script type="module">
  import * as THREE from 'three';
  import {
    applyHannWindow, fftRadix2, computeFFTBins,
    computeFFTBinsInto, buildBinMap, bowlFactor, buildAWeightGain
  } from './dsp.js';

  /* ── Parameters ───────────────────────────────────────────── */
  const P = {
    rows: 60, cols: 128,
    maxDisp: 2.2, bowlExp: 2.0,
    lfoDepth: 0.0, lfoRate: 0.12,
    smoothing: 0.55, freqScale: 'dnb', freqRange: 0.55,
    // Modulation depths (0 = off)
    modSub:   0.5,   // sub RMS  → maxDisp boost
    modKick:  0.8,   // kick peak → camera Z push
    modMid:   0.6,   // mid mean  → camera Y lift
    modHigh:  0.8,   // high mean → bowlExp soften
    modRms:   0.5,   // full RMS  → camera Z breath
    modTrans: 0.4,   // transient → opacity flash
  };

  /* ── localStorage persistence ─────────────────────────────── */
  const STORAGE_KEY = 'psychograph_params';

  function saveParams() {
    const meta = {
      title:  document.getElementById('pTitle').value,
      artist: document.getElementById('pArtist').value,
      bpm:    document.getElementById('pBpm').value,
      genre:  document.getElementById('pGenre').value,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...P, ...meta }));
  }

  function loadParams() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      const numKeys = ['rows','cols','maxDisp','bowlExp','lfoDepth','lfoRate','smoothing','freqRange',
                       'modSub','modKick','modMid','modHigh','modRms','modTrans'];
      for (const k of numKeys) if (saved[k] !== undefined) P[k] = +saved[k];
      if (saved.freqScale) P.freqScale = saved.freqScale;

      const si = (id, v) => { const e = document.getElementById(id); if (e) e.value = v; };
      const ss = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
      si('pFreqScale', P.freqScale); ss('vFreqScale', P.freqScale);
      si('pFreqRange', P.freqRange); ss('vFreqRange', P.freqRange);
      si('pSmoothing', P.smoothing); ss('vSmoothing', P.smoothing);
      si('pMaxDisp',   P.maxDisp);   ss('vMaxDisp',   P.maxDisp);
      si('pBowlExp',   P.bowlExp);   ss('vBowlExp',   P.bowlExp);
      si('pLfoDepth',  P.lfoDepth);  ss('vLfoDepth',  P.lfoDepth);
      si('pLfoRate',   P.lfoRate);   ss('vLfoRate',   P.lfoRate);
      si('pRows',      P.rows);      ss('vRows',      P.rows);
      si('pCols',      P.cols);      ss('vCols',      P.cols);
      si('pModSub',    P.modSub);    ss('vModSub',    P.modSub);
      si('pModKick',   P.modKick);   ss('vModKick',   P.modKick);
      si('pModMid',    P.modMid);    ss('vModMid',    P.modMid);
      si('pModHigh',   P.modHigh);   ss('vModHigh',   P.modHigh);
      si('pModRms',    P.modRms);    ss('vModRms',    P.modRms);
      si('pModTrans',  P.modTrans);  ss('vModTrans',  P.modTrans);
      if (saved.title)  si('pTitle',  saved.title);
      if (saved.artist) si('pArtist', saved.artist);
      if (saved.bpm)    si('pBpm',    saved.bpm);
      if (saved.genre)  si('pGenre',  saved.genre);
      updateTrackDisplay();
      // Rebuild geometry to match restored rows/cols
      rebuildGrid();
      rebuildHistory();
    } catch (_) {}
  }

  /* ── Fixed constants ──────────────────────────────────────── */
  const FFT_SIZE   = 2048;
  const NUM_BINS   = FFT_SIZE / 2;
  const GRID_W     = 10;
  const GRID_D     = 10;
  const LINE_COLOR = 0xe8d5b0;
  const BG_COLOR   = 0x0d0d0d;
  const EXPORT_W   = 1920;
  const EXPORT_H   = 1080;
  let   isExporting = false;

  /* ── Renderer ─────────────────────────────────────────────── */
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(BG_COLOR, 1);
  document.body.appendChild(renderer.domElement);

  /* ── Scene & Camera ───────────────────────────────────────── */
  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 5.5, 9);
  camera.lookAt(0, -0.5, 0);

  /* ── Grid ─────────────────────────────────────────────────── */
  const lines = [], posBuffers = [];
  const material = new THREE.LineBasicMaterial({ color: LINE_COLOR });

  function rebuildGrid() {
    lines.forEach(l => scene.remove(l));
    lines.length = posBuffers.length = 0;
    for (let r = 0; r < P.rows; r++) {
      const z = (r / (P.rows - 1) - 0.5) * GRID_D;
      const positions = new Float32Array(P.cols * 3);
      for (let c = 0; c < P.cols; c++) {
        positions[c * 3]     = (c / (P.cols - 1) - 0.5) * GRID_W;
        positions[c * 3 + 2] = z;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const line = new THREE.Line(geo, material);
      scene.add(line);
      lines.push(line);
      posBuffers.push(positions);
    }
  }
  rebuildGrid();

  /* ── History ring buffer ──────────────────────────────────── */
  const histBuf = [];
  let histHead = 0;

  function rebuildHistory() {
    histBuf.length = 0;
    for (let i = 0; i < P.rows; i++) histBuf.push(new Float32Array(NUM_BINS));
    histHead = 0;
  }
  rebuildHistory();

  /* ── DSP tables ───────────────────────────────────────────── */
  const aWeightGain = buildAWeightGain(NUM_BINS, FFT_SIZE, 44100);
  let binMap = buildBinMap(P.freqScale, P.cols / 2, NUM_BINS, P.freqRange, 44100);

  function refreshBinMap() {
    binMap = buildBinMap(P.freqScale, P.cols / 2, NUM_BINS, P.freqRange, 44100);
  }

  /* ── LFO ──────────────────────────────────────────────────── */
  let lfoPhase = 0;
  function lfoTick(dt) { lfoPhase = (lfoPhase + 2 * Math.PI * P.lfoRate * dt) % (2 * Math.PI); }

  /* ══════════════════════════════════════════════════════════
     AUDIO-REACTIVE MODULATION
     Each feature is extracted per-frame then fed through an
     asymmetric slew limiter (fast attack, slower release) so
     modulation tracks transients snappily but decays smoothly.

     All values are ADDITIVE offsets on top of P.* so sliders
     always act as the base level. Nothing is overwritten.

     Bin ranges (sr=44100, FFT_SIZE=2048, hzPerBin≈21.5Hz):
       sub      20–120Hz   bins  1–6
       kick     80–200Hz   bins  4–9   (overlap intentional)
       mid     500–4kHz    bins 23–186
       high    6–14kHz     bins 279–651
  ══════════════════════════════════════════════════════════ */

  // Slew-limited follower: fast attack, slower release
  // attack/release are per-frame coefficients (0=instant, 0.99=very slow)
  function slew(current, target, attack, release) {
    return target > current
      ? current + (1 - attack)  * (target - current)
      : current + (1 - release) * (target - current);
  }

  // Envelope followers (0..1)
  const env = {
    sub:    0,   // 20–120Hz RMS   → maxDisp boost
    kick:   0,   // 80–200Hz peak  → camera Z punch
    mid:    0,   // 500–4kHz mean  → camera Y lift
    high:   0,   // 6–14kHz mean   → bowlExp soften
    rms:    0,   // full-spectrum  → slow camera breath
    trans:  0,   // frame Δ RMS    → opacity flash
  };

  // Previous RMS for transient detection
  let prevRms = 0;

  // Slew rate constants (per-frame, at 60fps approx)
  const ATK  = 0.05;   // ~1 frame attack
  const REL  = {
    sub:   0.82,   // 18-frame release  (~0.3s)
    kick:  0.70,   // 10-frame release  (~0.16s)
    mid:   0.88,   // 25-frame release  (~0.4s)
    high:  0.90,   // 30-frame release  (~0.5s)
    rms:   0.97,   // 100-frame release (~1.7s)
    trans: 0.60,   // 5-frame release   (~0.08s) — sharp flash
  };

  // Base camera position — modulation adds offsets
  const CAM_BASE = { y: 5.5, z: 9.0 };

  function computeEnvelopes(fd) {
    // fd is Uint8Array[NUM_BINS], values 0–255

    // Sub: bins 1–6 (~20–130Hz)
    let subSum = 0;
    for (let k = 1; k <= 6; k++) subSum += fd[k];
    const subRaw = subSum / (6 * 255);

    // Kick: bins 4–9 peak (~80–200Hz) — use max not mean for punchy tracking
    let kickPeak = 0;
    for (let k = 4; k <= 9; k++) if (fd[k] > kickPeak) kickPeak = fd[k];
    const kickRaw = kickPeak / 255;

    // Mid: bins 23–186 (~500Hz–4kHz) mean
    let midSum = 0;
    for (let k = 23; k <= 186; k++) midSum += fd[k];
    const midRaw = midSum / (164 * 255);

    // High: bins 279–651 (~6kHz–14kHz) mean
    let highSum = 0;
    for (let k = 279; k <= 651; k++) highSum += fd[k];
    const highRaw = highSum / (373 * 255);

    // Full-spectrum RMS
    let sq = 0;
    for (let k = 0; k < NUM_BINS; k++) sq += (fd[k] / 255) ** 2;
    const rmsRaw = Math.sqrt(sq / NUM_BINS);

    // Transient: positive-only delta RMS (attack detector)
    const delta  = Math.max(0, rmsRaw - prevRms);
    prevRms = rmsRaw;
    const transRaw = Math.min(delta * 8, 1);  // scale up, clamp

    // Update followers
    env.sub   = slew(env.sub,   subRaw,   ATK, REL.sub);
    env.kick  = slew(env.kick,  kickRaw,  ATK, REL.kick);
    env.mid   = slew(env.mid,   midRaw,   ATK, REL.mid);
    env.high  = slew(env.high,  highRaw,  ATK, REL.high);
    env.rms   = slew(env.rms,   rmsRaw,   ATK, REL.rms);
    env.trans = slew(env.trans, transRaw, ATK, REL.trans);
  }

  function applyModulation() {
    const camY = CAM_BASE.y + env.mid  * P.modMid;
    const camZ = CAM_BASE.z - env.rms  * P.modRms + env.kick * P.modKick;
    camera.position.y    = camY;
    camera.position.z    = camZ;
    camera.lookAt(0, -0.5, 0);
    material.opacity     = 0.6 + env.trans * P.modTrans;
    material.transparent = true;
  }

  function modDisp()    { return P.maxDisp * (1 + env.sub * P.modSub); }
  function modBowlExp() { return P.bowlExp + P.lfoDepth * Math.sin(lfoPhase) - env.high * P.modHigh; }

  // Export-compatible version: same math on pre-computed envelopes
  function computeEnvelopesExport(fd, expEnv, expPrevRms) {
    let subSum = 0; for (let k = 1; k <= 6; k++) subSum += fd[k];
    const subRaw = subSum / (6 * 255);
    let kickPeak = 0; for (let k = 4; k <= 9; k++) if (fd[k] > kickPeak) kickPeak = fd[k];
    const kickRaw = kickPeak / 255;
    let midSum = 0; for (let k = 23; k <= 186; k++) midSum += fd[k];
    const midRaw = midSum / (164 * 255);
    let highSum = 0; for (let k = 279; k <= 651; k++) highSum += fd[k];
    const highRaw = highSum / (373 * 255);
    let sq = 0; for (let k = 0; k < NUM_BINS; k++) sq += (fd[k]/255)**2;
    const rmsRaw = Math.sqrt(sq / NUM_BINS);
    const transRaw = Math.min(Math.max(0, rmsRaw - expPrevRms) * 8, 1);

    expEnv.sub   = slew(expEnv.sub,   subRaw,   ATK, REL.sub);
    expEnv.kick  = slew(expEnv.kick,  kickRaw,  ATK, REL.kick);
    expEnv.mid   = slew(expEnv.mid,   midRaw,   ATK, REL.mid);
    expEnv.high  = slew(expEnv.high,  highRaw,  ATK, REL.high);
    expEnv.rms   = slew(expEnv.rms,   rmsRaw,   ATK, REL.rms);
    expEnv.trans = slew(expEnv.trans, transRaw, ATK, REL.trans);
    return rmsRaw;  // return for next frame's transient detection
  }

  function currentBowlExp() { return modBowlExp(); }

  /* ── Live audio ───────────────────────────────────────────── */
  let analyser = null, freqData = null, audioReady = false;

  async function initAudio() {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    const ctx    = new AudioContext();
    const src    = ctx.createMediaStreamSource(stream);
    analyser     = ctx.createAnalyser();
    analyser.fftSize               = FFT_SIZE;
    analyser.smoothingTimeConstant = P.smoothing;
    src.connect(analyser);
    freqData   = new Uint8Array(analyser.frequencyBinCount);
    audioReady = true;
  }

  /* ── Start / loading overlay ──────────────────────────────── */
  const overlay    = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlayMsg');
  const loadBar    = document.getElementById('loadBar');
  let started = false;

  // Mark ready once Three.js scene is initialised (end of this script)
  function overlayReady() {
    loadBar.classList.add('done');
    overlayMsg.textContent = 'click to begin';
    overlay.classList.add('ready');
  }

  overlay.addEventListener('click', async () => {
    if (!overlay.classList.contains('ready') || started) return;
    started = true;
    overlay.classList.add('hidden');
    try { await initAudio(); } catch (e) { console.error('Audio init:', e); }
  });

  window.addEventListener('resize', () => {
    if (isExporting) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ── Displacement ─────────────────────────────────────────── */
  function pushHistory(fd) {
    histHead = (histHead + P.rows - 1) % P.rows;
    const row = histBuf[histHead];
    for (let k = 0; k < NUM_BINS; k++) row[k] = (fd[k] / 255) * aWeightGain[k];
  }

  function applyDisplacement(fd, bowlExp, dispScale) {
    pushHistory(fd);
    const disp = dispScale !== undefined ? dispScale : modDisp();
    const half = P.cols / 2;
    for (let r = 0; r < P.rows; r++) {
      const pos  = posBuffers[r];
      const hrow = histBuf[(histHead + r) % P.rows];
      const bf   = bowlFactor(r, P.rows, bowlExp);
      for (let c = 0; c < P.cols; c++) {
        const m = c < half ? c : P.cols - 1 - c;
        pos[c * 3 + 1] = -hrow[binMap[Math.min(m, half - 1)]] * bf * disp;
      }
      lines[r].geometry.attributes.position.needsUpdate = true;
    }
  }

  /* ── Track display ────────────────────────────────────────── */
  function updateTrackDisplay() {
    const title  = document.getElementById('pTitle').value.trim();
    const artist = document.getElementById('pArtist').value.trim();
    const bpm    = document.getElementById('pBpm').value.trim();
    const genre  = document.getElementById('pGenre').value.trim();
    const time   = document.getElementById('dispCurrent').textContent.trim();

    document.getElementById('dispTitle').textContent  = title;
    document.getElementById('dispArtist').textContent = artist;
    document.getElementById('dispBpm').textContent    = bpm;
    document.getElementById('dispGenre').textContent  = genre;

    // Rule appears when title is present
    document.getElementById('dispRule').style.display = title ? 'block' : 'none';

    // Pills: hide the pill and its following divider when value is empty
    const showPill = (pillId, divId, hasVal) => {
      document.getElementById(pillId).style.display  = hasVal ? 'flex' : 'none';
      if (divId) document.getElementById(divId).style.display = hasVal ? 'block' : 'none';
    };
    showPill('pillTime',  'divTime',  !!time);
    showPill('pillBpm',   'divBpm',   !!bpm);
    showPill('pillGenre', null,       !!genre);

    // Recalculate dividers: only show if the NEXT pill is also visible
    document.getElementById('divTime').style.display = (!!time && (!!bpm || !!genre)) ? 'block' : 'none';
    document.getElementById('divBpm').style.display  = (!!bpm && !!genre) ? 'block' : 'none';
  }

  function fmtTime(s) {
    return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  }

  function setTimeDisplay(cur, total) {
    document.getElementById('dispCurrent').textContent =
      total ? `${fmtTime(cur)} / ${fmtTime(total)}` : '';
    updateTrackDisplay();
  }

  /* ── Animation loop ───────────────────────────────────────── */
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    if (document.visibilityState === 'hidden') return; // skip render when tab hidden
    const dt = clock.getDelta();
    lfoTick(dt);
    if (audioReady) {
      analyser.getByteFrequencyData(freqData);
      computeEnvelopes(freqData);
      applyModulation();
      applyDisplacement(freqData, currentBowlExp());
    }
    renderer.render(scene, camera);
  }
  animate();
  overlayReady();

  /* ══════════════════════════════════════════════════════════
     PARAMETERS PANEL
  ══════════════════════════════════════════════════════════ */

  document.getElementById('paramsToggle').addEventListener('click', () => {
    document.getElementById('paramsPanel').classList.toggle('open');
  });

  function bindRange(id, valId, key, onChange) {
    const el = document.getElementById(id), lbl = document.getElementById(valId);
    el.addEventListener('input', () => {
      P[key] = parseFloat(el.value);
      lbl.textContent = el.value;
      if (onChange) onChange(P[key]);
      saveParams();
    });
  }
  function bindSelect(id, valId, key, onChange) {
    const el = document.getElementById(id), lbl = document.getElementById(valId);
    el.addEventListener('change', () => {
      P[key] = el.value;
      lbl.textContent = el.value;
      if (onChange) onChange(P[key]);
      saveParams();
    });
  }
  function bindText(id, cb) {
    document.getElementById(id).addEventListener('input', () => { if (cb) cb(); saveParams(); });
  }

  bindText('pTitle',  updateTrackDisplay);
  bindText('pArtist', updateTrackDisplay);
  bindText('pBpm',    updateTrackDisplay);
  bindText('pGenre',  updateTrackDisplay);

  bindSelect('pFreqScale', 'vFreqScale', 'freqScale', () => refreshBinMap());
  bindRange ('pFreqRange', 'vFreqRange', 'freqRange', () => refreshBinMap());
  bindRange ('pSmoothing', 'vSmoothing', 'smoothing', v => { if (analyser) analyser.smoothingTimeConstant = v; });
  bindRange('pMaxDisp',  'vMaxDisp',  'maxDisp');
  bindRange('pBowlExp',  'vBowlExp',  'bowlExp');
  bindRange('pLfoDepth', 'vLfoDepth', 'lfoDepth');
  bindRange('pLfoRate',  'vLfoRate',  'lfoRate');
  bindRange('pModSub',   'vModSub',   'modSub');
  bindRange('pModKick',  'vModKick',  'modKick');
  bindRange('pModMid',   'vModMid',   'modMid');
  bindRange('pModHigh',  'vModHigh',  'modHigh');
  bindRange('pModRms',   'vModRms',   'modRms');
  bindRange('pModTrans', 'vModTrans', 'modTrans');
  bindRange('pRows', 'vRows', 'rows', () => {
    P.rows = parseInt(document.getElementById('pRows').value);
    rebuildGrid(); rebuildHistory(); refreshBinMap();
  });
  bindRange('pCols', 'vCols', 'cols', () => {
    P.cols = parseInt(document.getElementById('pCols').value);
    rebuildGrid(); refreshBinMap();
  });

  loadParams();
  refreshBinMap();

  /* ══════════════════════════════════════════════════════════
     EXPORT PIPELINE
  ══════════════════════════════════════════════════════════ */

  // Scratch buffers allocated once per export, reused every frame
  // (avoids per-frame GC pressure that causes "Array buffer allocation failed")
  let _scratchPcm  = null;
  let _scratchRe   = null;
  let _scratchIm   = null;
  let _scratchRaw  = null;
  let _scratchPrev = null;
  let _scratchCurr = null;

  function allocExportScratch() {
    _scratchPcm  = new Float32Array(FFT_SIZE);
    _scratchRe   = new Float32Array(FFT_SIZE);
    _scratchIm   = new Float32Array(FFT_SIZE);
    _scratchRaw  = new Uint8Array(NUM_BINS);
    _scratchPrev = new Uint8Array(NUM_BINS);
    _scratchCurr = new Uint8Array(NUM_BINS);
  }

  function freeExportScratch() {
    _scratchPcm = _scratchRe = _scratchIm = null;
    _scratchRaw = _scratchPrev = _scratchCurr = null;
  }

  let savedDims = null;
  function beginExportResize() {
    savedDims = { w: window.innerWidth, h: window.innerHeight };
    renderer.setPixelRatio(1);
    renderer.setSize(EXPORT_W, EXPORT_H);
    camera.aspect = EXPORT_W / EXPORT_H;
    camera.updateProjectionMatrix();
    renderer.domElement.style.visibility = 'hidden';
  }
  function endExportResize() {
    if (!savedDims) return;
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(savedDims.w, savedDims.h);
    camera.aspect = savedDims.w / savedDims.h;
    camera.updateProjectionMatrix();
    renderer.domElement.style.visibility = '';
    savedDims = null;
  }

  async function encodeAudio(enc, buf) {
    const sr = buf.sampleRate, nch = buf.numberOfChannels, total = buf.length, CHUNK = 4096;
    for (let off = 0; off < total; off += CHUNK) {
      const n = Math.min(CHUNK, total - off);
      const pl = new Float32Array(n * nch);
      for (let ch = 0; ch < nch; ch++) pl.set(buf.getChannelData(ch).subarray(off, off+n), ch*n);
      const ad = new AudioData({ format:'f32-planar', sampleRate:sr, numberOfChannels:nch,
        numberOfFrames:n, timestamp:Math.round((off/sr)*1e6), data:pl });
      enc.encode(ad); ad.close();
    }
    await enc.flush();
  }

  // Single-pass streaming export: FFT + smooth + displace + encode per frame.
  // All intermediate buffers are pre-allocated; no per-frame heap allocations.
  async function runExport(venc, audioBuffer, fps, duration, onProgress) {
    const sr              = audioBuffer.sampleRate;
    const totalSamples    = audioBuffer.length;
    const samplesPerFrame = Math.ceil(sr / fps);
    const totalFrames     = Math.ceil(totalSamples / samplesPerFrame);

    // Mix to mono once (one Float32Array for the full track, unavoidable)
    const ch0  = audioBuffer.getChannelData(0);
    const ch1  = audioBuffer.numberOfChannels > 1 ? audioBuffer.getChannelData(1) : null;
    const mono = new Float32Array(totalSamples);
    for (let i = 0; i < totalSamples; i++) mono[i] = ch1 ? (ch0[i]+ch1[i])*0.5 : ch0[i];

    // Per-export state (all pre-allocated)
    const expHist   = Array.from({length:P.rows}, ()=>new Float32Array(NUM_BINS));
    const expBinMap = buildBinMap(P.freqScale, P.cols/2, NUM_BINS, P.freqRange, 44100);
    let   expHead   = 0, expLfo = 0, expPrevRms = 0;
    const expEnv    = { sub:0, kick:0, mid:0, high:0, rms:0, trans:0 };
    const smooth    = P.smoothing;
    const dt        = 1 / fps;

    for (let f = 0; f < totalFrames; f++) {
      while (venc.encodeQueueSize > 4) await new Promise(r => setTimeout(r, 0));

      // --- Fill PCM window into scratch buffer (no allocation) ---
      const ws = f * samplesPerFrame - NUM_BINS;
      for (let i = 0; i < FFT_SIZE; i++) {
        const x = ws + i;
        _scratchPcm[i] = (x >= 0 && x < totalSamples) ? mono[x] : 0;
      }

      // --- FFT into scratch re/im, result into _scratchRaw (no allocation) ---
      computeFFTBinsInto(_scratchPcm, _scratchRe, _scratchIm, _scratchRaw);

      // --- EMA smoothing: prev→curr in-place (swap references, no allocation) ---
      for (let k = 0; k < NUM_BINS; k++) {
        _scratchCurr[k] = Math.round(smooth * _scratchPrev[k] + (1 - smooth) * _scratchRaw[k]);
      }
      // Swap prev/curr without allocation
      const tmp = _scratchPrev; _scratchPrev = _scratchCurr; _scratchCurr = tmp;
      // _scratchPrev now holds the smoothed bins for this frame

      // --- Envelope followers ---
      expLfo = (expLfo + 2*Math.PI*P.lfoRate*dt) % (2*Math.PI);
      expPrevRms = computeEnvelopesExport(_scratchPrev, expEnv, expPrevRms);

      // --- Modulated params ---
      const be   = P.bowlExp + P.lfoDepth * Math.sin(expLfo) - expEnv.high * P.modHigh;
      const disp = P.maxDisp * (1 + expEnv.sub * P.modSub);

      camera.position.y = CAM_BASE.y + expEnv.mid  * P.modMid;
      camera.position.z = CAM_BASE.z - expEnv.rms  * P.modRms + expEnv.kick * P.modKick;
      camera.lookAt(0, -0.5, 0);
      material.opacity = 0.6 + expEnv.trans * P.modTrans;
      material.transparent = true;

      // --- History + displacement ---
      expHead = (expHead + P.rows - 1) % P.rows;
      const row = expHist[expHead];
      for (let k = 0; k < NUM_BINS; k++) row[k] = (_scratchPrev[k] / 255) * aWeightGain[k];

      const half = P.cols / 2;
      for (let r = 0; r < P.rows; r++) {
        const pos  = posBuffers[r];
        const hrow = expHist[(expHead+r)%P.rows];
        const bf   = bowlFactor(r, P.rows, be);
        for (let c = 0; c < P.cols; c++) {
          const m = c < half ? c : P.cols-1-c;
          pos[c*3+1] = -hrow[expBinMap[Math.min(m,half-1)]] * bf * disp;
        }
        lines[r].geometry.attributes.position.needsUpdate = true;
      }

      setTimeDisplay(f/fps, duration);
      renderer.render(scene, camera);

      const vf = new VideoFrame(renderer.domElement,
        { timestamp: Math.round(f*(1e6/fps)), duration: Math.round(1e6/fps) });
      venc.encode(vf, { keyFrame: true });
      vf.close();

      if (f % 10 === 0) { onProgress(Math.round((f/totalFrames)*100)); await new Promise(r=>setTimeout(r,0)); }
    }
  }

  const exportBtn  = document.getElementById('exportBtn');
  const progressEl = document.getElementById('progress');
  const wavInput   = document.getElementById('wavInput');

  async function startExport(wavFile) {
    if (isExporting) return;
    isExporting = true; exportBtn.disabled = true;
    const FPS = 30;
    try {
      progressEl.textContent = 'decoding...';
      const ab  = await wavFile.arrayBuffer();
      const tmp = new AudioContext();
      const buf = await tmp.decodeAudioData(ab);
      await tmp.close();

      const duration = buf.length / buf.sampleRate;
      allocExportScratch();
      beginExportResize();

      const { Muxer, ArrayBufferTarget } = Mp4Muxer;
      const target = new ArrayBufferTarget();
      const muxer  = new Muxer({ target,
        video: { codec:'avc', width:EXPORT_W, height:EXPORT_H },
        audio: { codec:'aac', sampleRate:buf.sampleRate, numberOfChannels:buf.numberOfChannels },
        fastStart: 'in-memory' });

      const venc = new VideoEncoder({
        output: (c,m)=>muxer.addVideoChunk(c,m), error: e=>console.error('VEnc:',e) });
      const vcfg = { codec:'avc1.640028', width:EXPORT_W, height:EXPORT_H,
        framerate:FPS, bitrateMode:'quantizer', quantizer:0, latencyMode:'quality' };
      const sup = await VideoEncoder.isConfigSupported(vcfg);
      if (!sup.supported) { delete vcfg.bitrateMode; delete vcfg.quantizer; delete vcfg.latencyMode; vcfg.bitrate=100e6; }
      venc.configure(vcfg);

      const aenc = new AudioEncoder({
        output: (c,m)=>muxer.addAudioChunk(c,m), error: e=>console.error('AEnc:',e) });
      aenc.configure({ codec:'mp4a.40.2', sampleRate:buf.sampleRate,
        numberOfChannels:buf.numberOfChannels, bitrate:192e3 });

      progressEl.textContent = '0%';
      await runExport(venc, buf, FPS, duration, p => {
        progressEl.textContent = `${p}%`;
      });

      progressEl.textContent = 'audio...';
      await encodeAudio(aenc, buf);
      progressEl.textContent = 'muxing...';
      await venc.flush();
      muxer.finalize();

      const blob = new Blob([target.buffer], { type:'video/mp4' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = `${wavFile.name.replace(/\.[^.]+$/,'')}_psychograph.mp4`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 5000);
      progressEl.textContent = 'done.';

    } catch (err) {
      console.error('Export failed:', err);
      progressEl.textContent = `err: ${err.message??err}`;
    } finally {
      freeExportScratch();
      endExportResize();
      // Restore camera and opacity to base values
      camera.position.y = CAM_BASE.y;
      camera.position.z = CAM_BASE.z;
      camera.lookAt(0, -0.5, 0);
      material.opacity = 1.0;
      material.transparent = false;
      isExporting = false; exportBtn.disabled = false; setTimeDisplay(0,0);
    }
  }

  if (typeof VideoEncoder === 'undefined') {
    progressEl.textContent = 'chrome 94+ required'; exportBtn.disabled = true;
  }
  exportBtn.addEventListener('click', () => { if (!isExporting) wavInput.click(); });
  wavInput.addEventListener('change', e => {
    const f = e.target.files[0]; if (f) { startExport(f); wavInput.value=''; }
  });

</script>
</body>
</html>
