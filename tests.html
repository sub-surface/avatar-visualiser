<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PSYCHOGRAPH — Tests</title>
  <script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    } }
  </script>
  <style>
    body { background: #0d0d0d; color: #c8c8c8; font-family: 'Courier New', monospace; font-size: 0.8rem; padding: 24px; line-height: 1.7; }
    h1 { color: #e8d5b0; letter-spacing: 0.3em; font-size: 0.9rem; margin-bottom: 20px; font-weight: normal; }
    h2 { color: rgba(232,213,176,0.5); letter-spacing: 0.2em; font-size: 0.75rem; margin: 18px 0 6px; font-weight: normal; }
    .pass { color: #7ec87e; }
    .fail { color: #e07070; }
    #summary { margin-top: 20px; color: #e8d5b0; letter-spacing: 0.15em; }
  </style>
</head>
<body>
<h1>PSYCHOGRAPH / TESTS</h1>
<div id="out"></div>
<div id="summary"></div>

<script type="module">
  import {
    applyHannWindow, fftRadix2, computeFFTBins, computeFFTBinsInto,
    buildBinMap, bowlFactor, buildAWeightGain
  } from './dsp.js';

  import {
    camState, shouldModulate, shouldWriteBack,
    startDrag, endDrag, toggleLock, setLocked,
    startSliderDrag, endSliderDrag,
    beginProgrammatic, endProgrammatic, resetAll,
    setDirectorOpen,
    cartToSpherical, sphericalToCart,
    PRESET_DEFAULTS,
  } from './cam.js';

  /* ── Minimal test harness ──────────────────────────────────── */
  const results = [];
  const out     = document.getElementById('out');

  function section(name) {
    const h = document.createElement('h2');
    h.textContent = name;
    out.appendChild(h);
  }

  function test(name, fn) {
    let ok = false, msg = '';
    try {
      fn();
      ok = true;
    } catch (e) {
      msg = e.message ?? String(e);
    }
    results.push(ok);
    const el = document.createElement('div');
    el.className = ok ? 'pass' : 'fail';
    el.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${ok ? '' : `  —  ${msg}`}`;
    out.appendChild(el);
  }

  function assert(cond, msg) {
    if (!cond) throw new Error(msg ?? 'assertion failed');
  }
  function assertClose(a, b, tol, msg) {
    if (Math.abs(a - b) > tol)
      throw new Error(`${msg ?? ''}: expected ${b} ±${tol}, got ${a}`);
  }
  function assertMonotone(arr, msg) {
    for (let i = 1; i < arr.length; i++) {
      if (arr[i] < arr[i - 1])
        throw new Error(`${msg ?? 'not monotone'} at index ${i}: ${arr[i-1]} > ${arr[i]}`);
    }
  }

  /* ── Helpers ───────────────────────────────────────────────── */
  const SR      = 44100;
  const FFT_N   = 2048;
  const NUM_BINS = FFT_N / 2;

  function makeSine(freq, n, sr, amp = 0.9) {
    const buf = new Float32Array(n);
    for (let i = 0; i < n; i++) buf[i] = amp * Math.sin(2 * Math.PI * freq * i / sr);
    return buf;
  }

  function dominantBin(bins) {
    let max = -1, idx = 0;
    for (let i = 0; i < bins.length; i++) if (bins[i] > max) { max = bins[i]; idx = i; }
    return idx;
  }

  /* ════════════════════════════════════════════════════════════
     1. FFT CORRECTNESS
  ════════════════════════════════════════════════════════════ */
  section('FFT correctness');

  test('applyHannWindow: sum of squares ≈ 3N/8', () => {
    const buf = new Float32Array(FFT_N).fill(1);
    applyHannWindow(buf);
    const sos = buf.reduce((s, v) => s + v * v, 0);
    assertClose(sos, 3 * FFT_N / 8, FFT_N * 0.02, 'Hann SOS');
  });

  test('fftRadix2: DC bin for constant signal', () => {
    const re = new Float32Array(FFT_N).fill(1);
    const im = new Float32Array(FFT_N).fill(0);
    fftRadix2(re, im);
    // DC bin magnitude should equal N
    assertClose(re[0], FFT_N, FFT_N * 0.001, 'DC re[0]');
    assertClose(im[0], 0, 0.001, 'DC im[0]');
  });

  test('fftRadix2: 440 Hz sine dominant bin correct', () => {
    const signal = makeSine(440, FFT_N, SR);
    const re = new Float32Array(signal);
    const im = new Float32Array(FFT_N);
    fftRadix2(re, im);
    const mags = new Float32Array(NUM_BINS);
    for (let k = 0; k < NUM_BINS; k++) mags[k] = Math.sqrt(re[k]*re[k] + im[k]*im[k]);
    const dom     = dominantBin(mags);
    const expected = Math.round(440 * FFT_N / SR);
    assert(Math.abs(dom - expected) <= 1, `dominant bin ${dom}, expected ${expected} ±1`);
  });

  test('computeFFTBins: silence → all bins 0', () => {
    const bins = computeFFTBins(new Float32Array(FFT_N));
    assert(bins.every(v => v === 0), 'expected all-zero bins for silence');
  });

  test('computeFFTBins: 1kHz full-scale sine → bin at 1kHz > 180', () => {
    const signal = makeSine(1000, FFT_N, SR);
    const bins   = computeFFTBins(signal);
    const kBin   = Math.round(1000 * FFT_N / SR);
    assert(bins[kBin] > 180, `1kHz bin value ${bins[kBin]}, expected > 180`);
  });

  test('computeFFTBins: output is Uint8Array of length FFT_N/2', () => {
    const bins = computeFFTBins(new Float32Array(FFT_N));
    assert(bins instanceof Uint8Array, 'not Uint8Array');
    assert(bins.length === NUM_BINS, `length ${bins.length}, expected ${NUM_BINS}`);
  });

  /* ════════════════════════════════════════════════════════════
     2. BIN MAP
  ════════════════════════════════════════════════════════════ */
  section('Bin mapping');

  const HALF_COLS  = 64;
  const FREQ_RANGE = 0.55;

  test('linear: first bin = 0', () => {
    const m = buildBinMap('linear', HALF_COLS, NUM_BINS, FREQ_RANGE, SR);
    assert(m[0] === 0, `m[0]=${m[0]}`);
  });

  test('linear: last bin ≈ freqRange * NUM_BINS', () => {
    const m = buildBinMap('linear', HALF_COLS, NUM_BINS, FREQ_RANGE, SR);
    const expected = Math.round(FREQ_RANGE * NUM_BINS);
    assertClose(m[HALF_COLS - 1], expected, 2, 'last bin');
  });

  test('linear: monotonically non-decreasing', () => {
    const m = buildBinMap('linear', HALF_COLS, NUM_BINS, FREQ_RANGE, SR);
    assertMonotone(m, 'linear binMap');
  });

  test('log: monotonically non-decreasing', () => {
    const m = buildBinMap('log', HALF_COLS, NUM_BINS, FREQ_RANGE, SR);
    assertMonotone(m, 'log binMap');
  });

  test('log: denser at low end than linear (first quarter wider)', () => {
    const lin = buildBinMap('linear', HALF_COLS, NUM_BINS, FREQ_RANGE, SR);
    const log = buildBinMap('log',    HALF_COLS, NUM_BINS, FREQ_RANGE, SR);
    // Log should map more cols to low bins: midpoint col should be at lower bin in log than linear
    const mid = Math.floor(HALF_COLS / 2);
    assert(log[mid] < lin[mid], `log mid bin ${log[mid]} not < linear mid bin ${lin[mid]}`);
  });

  test('dnb: first 25% of cols map into 40–180 Hz', () => {
    const m         = buildBinMap('dnb', HALF_COLS, NUM_BINS, 1.0, SR);
    const hzPerBin  = (SR / 2) / NUM_BINS;
    const quarter   = Math.floor(HALF_COLS * 0.25);
    // All bins in first quarter should be in 40–180Hz range
    for (let c = 0; c < quarter; c++) {
      const hz = m[c] * hzPerBin;
      assert(hz >= 35 && hz <= 185, `col ${c}: ${hz.toFixed(0)}Hz not in 40–180Hz`);
    }
  });

  test('dnb: middle 50% of cols span 500–6000 Hz', () => {
    const m        = buildBinMap('dnb', HALF_COLS, NUM_BINS, 1.0, SR);
    const hzPerBin = (SR / 2) / NUM_BINS;
    const lo = Math.floor(HALF_COLS * 0.25);
    const hi = Math.floor(HALF_COLS * 0.75);
    const hzLo = m[lo] * hzPerBin;
    const hzHi = m[hi] * hzPerBin;
    assert(hzLo >= 450 && hzLo <= 600,   `lower boundary: ${hzLo.toFixed(0)}Hz, expected ~500`);
    assert(hzHi >= 5000 && hzHi <= 7000, `upper boundary: ${hzHi.toFixed(0)}Hz, expected ~6000`);
  });

  test('dnb: last 25% of cols span 6000–16000 Hz', () => {
    const m        = buildBinMap('dnb', HALF_COLS, NUM_BINS, 1.0, SR);
    const hzPerBin = (SR / 2) / NUM_BINS;
    const lo = Math.floor(HALF_COLS * 0.75);
    const hi = HALF_COLS - 1;
    const hzLo = m[lo] * hzPerBin;
    const hzHi = m[hi] * hzPerBin;
    assert(hzLo >= 5500 && hzLo <= 6500, `lower boundary: ${hzLo.toFixed(0)}Hz, expected ~6000`);
    assert(hzHi >= 15000 && hzHi <= 17000, `upper boundary: ${hzHi.toFixed(0)}Hz, expected ~16000`);
  });

  test('dnb: monotonically non-decreasing', () => {
    const m = buildBinMap('dnb', HALF_COLS, NUM_BINS, 1.0, SR);
    assertMonotone(m, 'dnb binMap');
  });

  /* ════════════════════════════════════════════════════════════
     3. BOWL FACTOR
  ════════════════════════════════════════════════════════════ */
  section('Bowl factor');

  test('centre row returns 1.0', () => {
    const rows = 60, exp = 2.0;
    const mid  = Math.round(rows / 2);
    assertClose(bowlFactor(mid, rows, exp), 1.0, 0.05, 'centre');
  });

  test('first row ≈ 0', () => {
    assertClose(bowlFactor(0, 60, 2.0), 0.0, 0.05, 'first row');
  });

  test('last row ≈ 0', () => {
    assertClose(bowlFactor(59, 60, 2.0), 0.0, 0.05, 'last row');
  });

  test('higher bowlExp → steeper falloff', () => {
    // At 25% from edge, higher exp should give lower value
    const r = 5, rows = 60;
    assert(bowlFactor(r, rows, 3.0) < bowlFactor(r, rows, 2.0), 'exp 3 should be smaller than exp 2 near edge');
  });

  /* ════════════════════════════════════════════════════════════
     4. A-WEIGHT GAIN
  ════════════════════════════════════════════════════════════ */
  section('A-weighting');

  test('gain is Float32Array of length NUM_BINS', () => {
    const g = buildAWeightGain(NUM_BINS, FFT_N, SR);
    assert(g instanceof Float32Array, 'not Float32Array');
    assert(g.length === NUM_BINS, `length ${g.length}`);
  });

  test('all gains in range 0.5–1.0 (blended with flat)', () => {
    const g = buildAWeightGain(NUM_BINS, FFT_N, SR);
    assert(g.every(v => v >= 0.49 && v <= 1.01), 'gain out of 0.5–1.0 range');
  });

  test('peak gain ≈ 1.0', () => {
    const g   = buildAWeightGain(NUM_BINS, FFT_N, SR);
    const max = Math.max(...g);
    assertClose(max, 1.0, 0.01, 'peak gain');
  });

  test('peak bin is near 3.5kHz (A-weight curve shape)', () => {
    // Use a larger FFT size for this test so bins have enough Hz resolution
    // to distinguish the A-weight curve shape (avoid Float32 floor at 0.5)
    const bigN   = FFT_N * 8;                          // 16384
    const bigBins = bigN / 2;
    const g      = buildAWeightGain(bigBins, bigN, SR);
    let peakBin  = 0;
    for (let k = 1; k < bigBins; k++) if (g[k] > g[peakBin]) peakBin = k;
    const peakHz = peakBin * SR / bigN;
    assert(peakHz >= 2000 && peakHz <= 5000,
      `peak at ${peakHz.toFixed(0)} Hz, expected 2–5 kHz`);
  });

  /* ════════════════════════════════════════════════════════════
     5. EXPORT SMOOTHING EMA
  ════════════════════════════════════════════════════════════ */
  section('Export EMA smoothing');

  test('step response: value after F frames follows (smooth)^F decay', () => {
    // Simulate: silence for 10 frames, then full signal for 20 frames
    // Check that response at onset+3 matches EMA formula
    const smooth    = 0.55;
    const FFT_HALF  = FFT_N / 2;
    let   prevBins  = new Uint8Array(FFT_HALF);

    // Build a fake single-bin signal (only bin 10 = 200)
    // Use a flat signal so computeFFTBins is predictable
    const silentBins = new Uint8Array(FFT_HALF); // all 0
    const loudBins   = new Uint8Array(FFT_HALF).fill(200);

    // Run 3 "loud" frames through the EMA
    let smoothed = new Uint8Array(FFT_HALF);
    // Frame 0 (loud)
    for (let k = 0; k < FFT_HALF; k++) smoothed[k] = Math.round(smooth * 0 + (1 - smooth) * 200);
    const expected1 = Math.round((1 - smooth) * 200);
    assertClose(smoothed[10], expected1, 2, `frame 1 EMA value`);

    // Frame 1 (loud)
    const prev = new Uint8Array(smoothed);
    for (let k = 0; k < FFT_HALF; k++) smoothed[k] = Math.round(smooth * prev[k] + (1 - smooth) * 200);
    const expected2 = Math.round(smooth * expected1 + (1 - smooth) * 200);
    assertClose(smoothed[10], expected2, 2, `frame 2 EMA value`);
  });

  /* ════════════════════════════════════════════════════════════
     6. EXPORT PIPELINE DIAGNOSTICS
  ════════════════════════════════════════════════════════════ */
  section('Export pipeline diagnostics');

  test('mono-mixing: averages two channels correctly', () => {
    const left  = new Float32Array([1.0, -1.0, 0.5, -0.5]);
    const right = new Float32Array([0.0,  0.0, 1.0,  1.0]);
    const mixed = new Float32Array(left.length);
    for (let i = 0; i < left.length; i++) mixed[i] = (left[i] + right[i]) * 0.5;
    assertClose(mixed[0], 0.5,  0.001, 'mix index 0');
    assertClose(mixed[1], -0.5, 0.001, 'mix index 1');
    assertClose(mixed[2], 0.75, 0.001, 'mix index 2');
    assertClose(mixed[3], 0.25, 0.001, 'mix index 3');
  });

  test('computeFFTBinsInto: avoids allocation and writes correct magnitudes', () => {
    const pcm = makeSine(1000, FFT_N, SR);
    const re  = new Float32Array(FFT_N);
    const im  = new Float32Array(FFT_N);
    const out = new Uint8Array(NUM_BINS);
    computeFFTBinsInto(pcm, re, im, out);
    const kBin = Math.round(1000 * FFT_N / SR);
    assert(out[kBin] > 180, `1kHz bin value ${out[kBin]}, expected > 180`);
  });

  test('computeEnvelopesExport: slew limit follows attack snappy, release slow', () => {
    // Slew logic: current + (1-rate)*(target-current)
    const ATK = 0.05, REL_SUB = 0.82;
    let env = { sub: 0, kick: 0, mid: 0, high: 0, rms: 0, trans: 0 };
    let prevRms = 0;

    // Simulate a "sub-bass" burst in bins 1-6
    const fd = new Uint8Array(NUM_BINS).fill(0);
    for (let k = 1; k <= 6; k++) fd[k] = 200; // ~0.78 scale

    // Frame 1 (Attack)
    prevRms = 0;
    // Mocking the behavior from index.html (subRaw = sum / (6*255))
    const subRaw = (200 * 6) / (6 * 255);
    const expectedAtk = 0 + (1 - ATK) * (subRaw - 0);
    // Manual calculation of the slew logic for verification
    let currentEnvSub = 0;
    currentEnvSub = currentEnvSub + (1 - ATK) * (subRaw - currentEnvSub);

    assertClose(currentEnvSub, expectedAtk, 0.001, 'sub attack');

    // Frame 2 (Release to zero)
    const fdSilence = new Uint8Array(NUM_BINS).fill(0);
    const expectedRel = expectedAtk + (1 - REL_SUB) * (0 - expectedAtk);
    currentEnvSub = currentEnvSub + (1 - REL_SUB) * (0 - currentEnvSub);

    assertClose(currentEnvSub, expectedRel, 0.001, 'sub release');
  });

  test('resolution calculation: returns correct dims for presets/orientations', () => {
    const calc = (preset, orient) => {
      let w, h;
      const isVert = orient === 'vertical';
      if (preset === 'lofi') {
        w = isVert ? 480 : 640;
        h = isVert ? 640 : 480;
      } else {
        w = isVert ? 1080 : 1920;
        h = isVert ? 1920 : 1080;
      }
      return { w, h };
    };

    let d = calc('standard', 'horizontal');
    assert(d.w === 1920 && d.h === 1080, 'std horiz');
    
    d = calc('standard', 'vertical');
    assert(d.w === 1080 && d.h === 1920, 'std vert');

    d = calc('lofi', 'horizontal');
    assert(d.w === 640 && d.h === 480, 'lofi horiz');

    d = calc('lofi', 'vertical');
    assert(d.w === 480 && d.h === 640, 'lofi vert');
  });

  /* ════════════════════════════════════════════════════════════
     7. GEOMETRY POSITION CALCULATORS
     Tests the pure calcPos functions exported from each vis module.
     No Three.js, no DOM — just maths.
  ════════════════════════════════════════════════════════════ */
  section('Geometry position calculators');

  import { calcBowlPos } from './vis/bowl.js';
  import { calcPolarPos } from './vis/polar.js';
  import { calcSpherePos } from './vis/sphere.js';
  import { calcWavePos } from './vis/wave.js';

  // Shared synthetic data for all calc tests
  const ROWS = 60, COLS = 128, HALF = 64;
  const flatBinMap = new Uint16Array(HALF).map((_, i) => i); // bin i → bin i
  const zeroRow  = new Float32Array(NUM_BINS);   // silence
  const fullRow  = new Float32Array(NUM_BINS).fill(1.0); // full scale

  test('calcBowlPos: silence → y = 0', () => {
    const out = [0, 0, 0];
    calcBowlPos(out, 30, 64, ROWS, COLS, zeroRow, zeroRow, HALF, flatBinMap, 1.0, 2.2);
    assertClose(out[1], 0, 0.0001, 'y should be 0 for silence');
  });

  test('calcBowlPos: full signal → y displaced downward', () => {
    const out = [0, 0, 0];
    calcBowlPos(out, 30, 64, ROWS, COLS, fullRow, fullRow, HALF, flatBinMap, 1.0, 2.2);
    assert(out[1] < 0, `y=${out[1].toFixed(3)} should be negative (displaced down)`);
  });

  test('calcBowlPos: x spans ±GRID_W/2 across cols', () => {
    const outL = [0, 0, 0], outR = [0, 0, 0];
    calcBowlPos(outL, 0, 0,        ROWS, COLS, zeroRow, zeroRow, HALF, flatBinMap, 0, 0);
    calcBowlPos(outR, 0, COLS - 1, ROWS, COLS, zeroRow, zeroRow, HALF, flatBinMap, 0, 0);
    assertClose(outL[0], -5.0, 0.01, 'left edge x');
    assertClose(outR[0],  5.0, 0.01, 'right edge x');
  });

  test('calcPolarPos: silence + bf=0 → radius = BASE_R', () => {
    const out = [0, 0, 0];
    calcPolarPos(out, 30, 0, ROWS, COLS, zeroRow, zeroRow, HALF, flatBinMap, 0, 0, 0);
    const r = Math.sqrt(out[0] ** 2 + out[2] ** 2);
    assertClose(r, 0.4, 0.01, 'radius should be BASE_R when bf=0');
  });

  test('calcPolarPos: silence + bf=1 → radius = MAX_R', () => {
    const out = [0, 0, 0];
    calcPolarPos(out, 30, 0, ROWS, COLS, zeroRow, zeroRow, HALF, flatBinMap, 1.0, 0, 0);
    const r = Math.sqrt(out[0] ** 2 + out[2] ** 2);
    assertClose(r, 4.5, 0.01, 'radius should be MAX_R when bf=1, disp=0, silence');
  });

  test('calcPolarPos: y spans polarSpacing range', () => {
    const outTop = [0, 0, 0], outBot = [0, 0, 0];
    calcPolarPos(outTop, 0,        0, ROWS, COLS, zeroRow, zeroRow, HALF, flatBinMap, 0, 0, 6);
    calcPolarPos(outBot, ROWS - 1, 0, ROWS, COLS, zeroRow, zeroRow, HALF, flatBinMap, 0, 0, 6);
    assertClose(outTop[1], -3.0, 0.05, 'top row y');
    assertClose(outBot[1],  3.0, 0.05, 'bottom row y');
  });

  test('calcSpherePos: poles lie on y-axis (sin(phi)=0)', () => {
    const outTop = [0, 0, 0], outBot = [0, 0, 0];
    calcSpherePos(outTop, 0,        0, ROWS, COLS, zeroRow, zeroRow, HALF, flatBinMap, 0, 3.0, 0);
    calcSpherePos(outBot, ROWS - 1, 0, ROWS, COLS, zeroRow, zeroRow, HALF, flatBinMap, 0, 3.0, 0);
    assertClose(outTop[0], 0, 0.001, 'top pole x=0');
    assertClose(outTop[2], 0, 0.001, 'top pole z=0');
    assertClose(outBot[0], 0, 0.001, 'bottom pole x=0');
    assertClose(outBot[2], 0, 0.001, 'bottom pole z=0');
  });

  test('calcSpherePos: equator radius ≈ sphereSize for silence', () => {
    const out = [0, 0, 0];
    const midRow = Math.floor(ROWS / 2);
    calcSpherePos(out, midRow, 0, ROWS, COLS, zeroRow, zeroRow, HALF, flatBinMap, 0, 3.0, 0);
    const r = Math.sqrt(out[0] ** 2 + out[2] ** 2);
    assertClose(r, 3.0, 0.05, 'equatorial radius should equal sphereSize');
  });

  test('calcWavePos: x spans ±5 across cols', () => {
    const outL = [0, 0, 0], outR = [0, 0, 0];
    calcWavePos(outL, 0, 0,        ROWS, COLS, zeroRow, zeroRow, HALF, flatBinMap, 0);
    calcWavePos(outR, 0, COLS - 1, ROWS, COLS, zeroRow, zeroRow, HALF, flatBinMap, 0);
    assertClose(outL[0], -5.0, 0.01, 'left x');
    assertClose(outR[0],  5.0, 0.01, 'right x');
  });

  test('calcWavePos: silence → z = 0', () => {
    const out = [0, 0, 0];
    calcWavePos(out, 0, 0, ROWS, COLS, zeroRow, zeroRow, HALF, flatBinMap, 2.2);
    assertClose(out[2], 0, 0.0001, 'z should be 0 for silence');
  });

  /* ════════════════════════════════════════════════════════════
     8. EXPORT COLS DERIVATION
  ════════════════════════════════════════════════════════════ */
  section('Export cols derivation');

  test('getCols() matches complexity * 32 and is always ≥ 2', () => {
    // Simulate getCols logic for a range of complexity values
    const getCols = (c) => Math.max(2, c * 32);
    for (const c of [0, 1, 2, 4, 8]) {
      const cols = getCols(c);
      assert(cols >= 2, `cols=${cols} for complexity=${c}`);
      assert(cols === Math.max(2, c * 32), `cols mismatch for complexity=${c}`);
    }
  });

  test('export binMap: halfCols = cols/2, no out-of-bounds bins', () => {
    const cols    = 128;
    const halfCols = cols / 2;
    const m = buildBinMap('log', halfCols, NUM_BINS, 0.55, SR);
    assert(m.length === halfCols, `binMap length ${m.length}, expected ${halfCols}`);
    assert(m.every(b => b < NUM_BINS), 'all bins should be < NUM_BINS');
  });

  test('color lerp: fv=0 → colA, fv≥0.5 → full colB blend', () => {
    const colA = { r: 0.0, g: 0.5, b: 1.0 };
    const colB = { r: 1.0, g: 0.0, b: 0.0 };
    const lerp = (fv) => {
      const t = Math.min(fv * 2.0, 1.0);
      return {
        r: colA.r + (colB.r - colA.r) * t,
        g: colA.g + (colB.g - colA.g) * t,
        b: colA.b + (colB.b - colA.b) * t,
      };
    };
    const atZero = lerp(0);
    assertClose(atZero.r, colA.r, 0.001, 'fv=0 r=colA.r');
    assertClose(atZero.g, colA.g, 0.001, 'fv=0 g=colA.g');
    const atHalf = lerp(0.5);
    assertClose(atHalf.r, colB.r, 0.001, 'fv=0.5 r=colB.r (full lerp)');
  });

  /* ════════════════════════════════════════════════════════════
     9. BROWSER COMPATIBILITY
     Validates every API the app relies on. Vivaldi is Chromium-based
     and should pass all checks. Firefox will fail WebCodecs + File
     System Access. Safari will fail WebCodecs + showSaveFilePicker.
  ════════════════════════════════════════════════════════════ */
  section('Browser compatibility');

  test('ES Modules: dynamic import resolves (we are running, so: pass)', () => {
    assert(true, 'trivially true — module script executed');
  });

  test('structuredClone (ES2022)', () => {
    const orig  = { a: 1, nested: [2, 3] };
    const clone = structuredClone(orig);
    assert(clone !== orig && clone.nested[0] === 2, 'structuredClone failed');
  });

  test('performance.now() available', () => {
    assert(typeof performance !== 'undefined' && typeof performance.now === 'function',
      'performance.now not available');
  });

  test('WebGL 2.0 context available', () => {
    const canvas = document.createElement('canvas');
    const gl     = canvas.getContext('webgl2');
    assert(gl !== null, 'WebGL 2 not available — Three.js will not initialise');
  });

  test('Web Audio API: AudioContext available', () => {
    assert(
      typeof window.AudioContext !== 'undefined' || typeof window.webkitAudioContext !== 'undefined',
      'AudioContext not found'
    );
  });

  test('Web Audio API: AnalyserNode constructable', () => {
    // AudioContext may be suspended without user gesture; presence check is the critical one
    assert(typeof AnalyserNode !== 'undefined', 'AnalyserNode not in global scope');
  });

  test('WebCodecs: VideoEncoder available', () => {
    assert(typeof VideoEncoder !== 'undefined',
      'VideoEncoder not found — video export will not work (requires Chromium 94+)');
  });

  test('WebCodecs: AudioEncoder available', () => {
    assert(typeof AudioEncoder !== 'undefined',
      'AudioEncoder not found — audio track in exports will not work');
  });

  test('WebCodecs: VideoFrame available', () => {
    assert(typeof VideoFrame !== 'undefined',
      'VideoFrame not found — frame capture unavailable');
  });

  test('File System Access API: showSaveFilePicker available', () => {
    assert(typeof window.showSaveFilePicker === 'function',
      'showSaveFilePicker not found — file save dialog will not open (requires Chromium 86+)');
  });

  test('OffscreenCanvas available', () => {
    assert(typeof OffscreenCanvas !== 'undefined',
      'OffscreenCanvas not found — overlay compositing unavailable');
  });

  test('ResizeObserver available', () => {
    assert(typeof ResizeObserver !== 'undefined', 'ResizeObserver not found');
  });

  test('Crypto: crypto.randomUUID or Math.random fallback', () => {
    // App uses Math.random, not crypto — this just confirms the runtime is sane
    assert(typeof Math.random === 'function', 'Math.random not available');
  });

  test('requestAnimationFrame available', () => {
    assert(typeof requestAnimationFrame === 'function',
      'requestAnimationFrame not found — render loop will not run');
  });

  test('CSS Custom Properties readable via getComputedStyle', () => {
    document.body.style.setProperty('--test-var', '42px');
    const val = getComputedStyle(document.body).getPropertyValue('--test-var').trim();
    document.body.style.removeProperty('--test-var');
    assert(val === '42px', `CSS custom property read failed: got "${val}"`);
  });

  test('Import maps: Three.js importmap would resolve (syntax check)', () => {
    // Can only verify statically: importmap support is implicit if this module ran.
    // Chromium 89+, Firefox 108+, Safari 16.4+ all support importmap.
    const s = document.querySelector('script[type="importmap"]');
    // index.html uses an importmap — presence here means the browser parsed it.
    // In tests.html there is no importmap, so null is expected and fine.
    assert(true, 'importmap syntax is valid (parsed by browser to reach this line)');
  });

  /* ════════════════════════════════════════════════════════════
     CAMERA STATE MACHINE
  ════════════════════════════════════════════════════════════ */
  section('Camera state machine');

  test('initial state: all flags false', () => {
    resetAll();
    assert(!camState.locked, 'locked should be false');
    assert(!camState.dragging, 'dragging should be false');
    assert(!camState.sliderDragging, 'sliderDragging should be false');
    assert(!camState.programmatic, 'programmatic should be false');
  });

  test('shouldModulate: true when idle', () => {
    resetAll();
    assert(shouldModulate() === true, 'should modulate in default state');
  });

  test('shouldModulate: false when locked', () => {
    resetAll();
    setLocked(true);
    assert(shouldModulate() === false, 'should not modulate when locked');
    resetAll();
  });

  test('shouldModulate: false when dragging', () => {
    resetAll();
    startDrag();
    assert(shouldModulate() === false, 'should not modulate during drag');
    resetAll();
  });

  test('shouldModulate: false when both locked and dragging', () => {
    resetAll();
    setLocked(true);
    startDrag();
    assert(shouldModulate() === false, 'should not modulate when locked+dragging');
    resetAll();
  });

  test('shouldWriteBack: false when idle', () => {
    resetAll();
    assert(shouldWriteBack() === false, 'false when idle');
  });

  test('shouldWriteBack: true when dragging', () => {
    resetAll();
    startDrag();
    assert(shouldWriteBack() === true, 'true when dragging');
    resetAll();
  });

  test('shouldWriteBack: false when dragging + programmatic', () => {
    resetAll();
    startDrag();
    beginProgrammatic();
    assert(shouldWriteBack() === false, 'false when dragging+programmatic');
    endProgrammatic();
    assert(shouldWriteBack() === true, 'true again after endProgrammatic');
    resetAll();
  });

  test('shouldWriteBack: false during programmatic update alone', () => {
    resetAll();
    beginProgrammatic();
    assert(shouldWriteBack() === false, 'should not write back during programmatic');
    resetAll();
  });

  test('sliderDragging: false by default, true during slider drag', () => {
    resetAll();
    assert(camState.sliderDragging === false, 'not dragging by default');
    startSliderDrag();
    assert(camState.sliderDragging === true, 'dragging during slider drag');
    endSliderDrag();
    assert(camState.sliderDragging === false, 'cleared after slider drag ends');
  });

  test('toggleLock: toggles and returns new value', () => {
    resetAll();
    const r1 = toggleLock();
    assert(r1 === true, 'first toggle should return true');
    assert(camState.locked === true, 'state should match return');
    const r2 = toggleLock();
    assert(r2 === false, 'second toggle should return false');
    assert(camState.locked === false, 'state should match return');
  });

  test('resetAll: clears all transient state', () => {
    camState.locked = true;
    camState.dragging = true;
    camState.sliderDragging = true;
    camState.programmatic = true;
    resetAll();
    assert(!camState.locked && !camState.dragging &&
           !camState.sliderDragging && !camState.programmatic,
      'all flags should be false after resetAll');
  });

  test('PRESET_DEFAULTS: all presets have finite spherical coords', () => {
    for (const p of PRESET_DEFAULTS) {
      assert(isFinite(p.az) && isFinite(p.el) && isFinite(p.dist) && isFinite(p.lookY),
        `preset '${p.id}' has non-finite value`);
      assert(typeof p.name === 'string' && p.name.length > 0, `preset '${p.id}' missing name`);
    }
  });

  test('PRESET_DEFAULTS: returns independent copies via map', () => {
    const a = PRESET_DEFAULTS[0];
    const b = PRESET_DEFAULTS[0];
    assert(a === b, 'same object ref (as expected for constants)');
  });

  test('cartToSpherical / sphericalToCart: round-trip accuracy', () => {
    const cases = [
      { x: 0, y: 5.5, z: 9 },
      { x: 8, y: 8, z: 8 },
      { x: 12, y: 2, z: 0.001 },
    ];
    for (const c of cases) {
      const sph  = cartToSpherical(c.x, c.y, c.z);
      const back = sphericalToCart(sph.az, sph.el, sph.dist);
      const eps  = 0.05;
      assert(Math.abs(back.x - c.x) < eps && Math.abs(back.y - c.y) < eps && Math.abs(back.z - c.z) < eps,
        `round-trip failed for (${c.x},${c.y},${c.z}): got (${back.x},${back.y},${back.z})`);
    }
  });

  test('cartToSpherical: azimuth in [0, 360)', () => {
    const cases = [
      { x: -5, y: 3, z: -5 },
      { x:  5, y: 3, z: -5 },
      { x: -5, y: 3, z:  5 },
    ];
    for (const c of cases) {
      const { az } = cartToSpherical(c.x, c.y, c.z);
      assert(az >= 0 && az < 360, `az ${az} out of [0,360) for (${c.x},${c.y},${c.z})`);
    }
  });

  test('directorOpen flag: shouldModulate paused when open', () => {
    resetAll();
    setDirectorOpen(true);
    assert(shouldModulate() === false, 'modulation should pause when director open');
    setDirectorOpen(false);
    assert(shouldModulate() === true, 'modulation should resume when director closed');
  });

  test('drag does not auto-lock: modulation resumes after endDrag', () => {
    resetAll();
    startDrag();
    assert(shouldModulate() === false, 'suppressed during drag');
    endDrag();
    assert(shouldModulate() === true, 'resumes after drag ends');
    assert(camState.locked === false, 'locked not set by drag');
  });

  test('slider drag does not affect lock or modulation', () => {
    resetAll();
    startSliderDrag();
    assert(shouldModulate() === true, 'slider drag does not suppress modulation');
    assert(camState.sliderDragging === true, 'sliderDragging flag set');
    endSliderDrag();
    assert(camState.sliderDragging === false, 'sliderDragging cleared');
  });

  /* ════════════════════════════════════════════════════════════
     SUMMARY
  ════════════════════════════════════════════════════════════ */
  const passed = results.filter(Boolean).length;
  const total  = results.length;
  const summary = document.getElementById('summary');
  summary.textContent = `${passed}/${total} tests passed`;
  summary.style.color = passed === total ? '#7ec87e' : '#e07070';

</script>
